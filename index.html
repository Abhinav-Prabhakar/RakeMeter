<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBB Flatcar Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="viewport">
<main class="stage" id="stage">

  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-flag">
        <svg viewBox="0 0 40 20" width="34" height="17" aria-hidden="true">
          <g fill="none" stroke="#fff" stroke-width="2.7" stroke-linejoin="miter">
            <path d="M15.6 3 9 10l6.6 7M24.4 3 31 10l-6.6 7M11 10h18M20 3v14"/>
          </g>
        </svg>
      </span>
      <span class="brand-name">SBB</span>
    </div>

    <nav class="mainnav">
      <button class="cbtn" aria-label="Home"><svg viewBox="0 0 16 16"><path d="M8 1.6 1.4 7.3c-.4.4-.1 1 .4 1h1.3v5.2c0 .5.4.9.9.9h2.6v-3.6c0-.4.3-.7.7-.7h1.4c.4 0 .7.3.7.7v3.6H12c.5 0 .9-.4.9-.9V8.3h1.3c.5 0 .8-.6.4-1z"/></svg></button>
      <button class="cbtn" aria-label="Dashboard"><svg viewBox="0 0 16 16"><rect x="1.8" y="1.8" width="5.6" height="7" rx="1.6"/><rect x="8.6" y="1.8" width="5.6" height="5" rx="1.6"/><rect x="1.8" y="10" width="5.6" height="4.2" rx="1.6"/><rect x="8.6" y="8" width="5.6" height="6.2" rx="1.6"/></svg></button>
      <button class="cbtn active" aria-label="Containers"><svg viewBox="0 0 16 16"><rect x="1.6" y="2" width="12.8" height="12" rx="3"/><path d="M5.5 5.2v3.6M4.2 7.6l1.3 1.3 1.3-1.3M10.5 5.2v3.6M9.2 7.6l1.3 1.3 1.3-1.3M4 11.4h8" stroke="#000" stroke-width="1.15" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="cbtn" aria-label="Energy"><svg viewBox="0 0 16 16"><path d="M9.6 1.2 3.4 9h4.1l-1.1 5.8L12.6 7H8.5z"/></svg></button>
      <button class="cbtn" aria-label="Reports"><svg viewBox="0 0 16 16"><path d="M7.2 2.3A5.9 5.9 0 1 0 13.7 8.8H7.2z"/><path d="M8.6 1.2v6.2h6.2a6.2 6.2 0 0 0-6.2-6.2z"/></svg></button>
      <button class="cbtn" aria-label="Documents"><svg viewBox="0 0 16 16"><path d="M4 1.5h5.2l3.8 3.8v8c0 .7-.6 1.2-1.2 1.2H4c-.7 0-1.2-.5-1.2-1.2V2.7c0-.7.5-1.2 1.2-1.2z"/><path d="M5.2 8.6h5.4M5.2 11h3.6" stroke="#e5e5e5" stroke-width="1.1" stroke-linecap="round"/><path d="M9 1.5v3.2c0 .4.3.7.7.7H13" fill="#5a5a5a"/></svg></button>
      <button class="cbtn" aria-label="Analytics"><svg viewBox="0 0 16 16"><rect x="1.6" y="1.6" width="12.8" height="12.8" rx="3.2"/><path d="m4.4 10.2 2.3-2.6 2 1.7 2.9-3.4" stroke="#e5e5e5" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>

    <div class="userbar">
      <button class="cbtn" aria-label="Notifications"><svg viewBox="0 0 16 16"><path d="M8 2.2c-2.3 0-4 1.8-4 4.1v2.9l-1.3 2c-.3.4 0 .9.5.9h9.6c.5 0 .8-.5.5-.9L12 9.2V6.3c0-2.3-1.7-4.1-4-4.1zM6.3 13.1a1.8 1.8 0 0 0 3.4 0z"/><circle cx="11.6" cy="3.6" r="2.3" fill="#f2453d" stroke="#e5e5e5" stroke-width=".9"/></svg></button>
      <button class="cbtn" aria-label="Search"><svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"><circle cx="7.4" cy="7.2" r="5.3"/><path d="m11.3 11.1 2.5 2.5"/></svg></button>
      <button class="cbtn" aria-label="Settings"><svg class="cog" viewBox="0 0 16 16"><use href="#cog"/></svg></button>
      <div class="avatar"><img src="assets/avatar.png" alt=""></div>
      <div class="user">
        <div class="user-name">Stewart Menzies</div>
        <div class="user-role">Oprerator</div>
      </div>
    </div>
  </header>

  <!-- ============ LEFT: RAKE DETAILS ============ -->
  <section class="panel panel-left">
    <div class="panel-title">Rake Details</div>
    <button class="cbtn sm panel-gear" aria-label="Panel settings"><svg class="cog" viewBox="0 0 16 16"><use href="#cog"/></svg></button>

    <div class="id-label" style="top:76px">Rake ID:</div>
    <div class="id-value" id="flatcarId" style="top:98px"></div>
    <canvas class="flatcar-img" id="flatcarThumb" aria-hidden="true"></canvas>

    <dl class="specs">
      <div style="left:30px;top:297px"><dt>From</dt><dd id="fFrom"></dd></div>
      <div style="left:312px;top:297px"><dt>Load</dt><dd id="fLoad"></dd></div>
      <div style="left:30px;top:367px"><dt>Status</dt><dd id="fStatus"></dd></div>
      <div style="left:312px;top:367px"><dt>Tipped</dt><dd id="fTipped"></dd></div>
      <div style="left:30px;top:436px"><dt id="fFreeLabel">Free time ends</dt><dd id="fFree"></dd></div>
    </dl>

    <!-- the meter: free time running out to the left of centre, the charge stacking up to the right -->
    <div class="radar">
      <div class="radar-title">Demurrage</div>
      <svg class="radar-grid" id="radarGrid" width="162" height="154" viewBox="0 0 162 154" role="img" aria-label="Demurrage meter"></svg>
      <div class="radar-pill" id="meterPill"></div>
      <div class="radar-axis ax-l">Placed</div>
      <div class="radar-axis ax-r">+7 h</div>
      <div class="radar-axis ax-b" id="axFree">Free time</div>
    </div>
  </section>

  <!-- ============ CENTER: CONTAINERS ============ -->
  <section class="panel panel-center">
    <canvas id="trainCanvas" aria-label="Train on the loading track"></canvas>
    <div class="panel-title" id="stageTitle"></div>
    <!-- the one black mark on the stage: how far through unloading, or where the rake stands -->
    <div class="badge" id="badge" tabindex="0" role="img">
      <svg class="badge-ring" viewBox="0 0 66 66" aria-hidden="true"><circle class="rim" cx="33" cy="33" r="31"/><circle class="arc" id="badgeArc" cx="33" cy="33" r="31"/></svg>
      <span class="badge-disc">
        <b id="badgeNum"></b>
        <svg class="i-coming" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9.4M8.8 4.2 12.6 8l-3.8 3.8"/></svg>
        <svg class="i-done" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3.6 8.4 2.9 2.9 5.9-6.4"/></svg>
      </span>
      <div class="tip" id="badgeTip"></div>
    </div>
    <div class="tip" id="stageTip"></div>
    <button class="add-btn" aria-label="Add container"><svg viewBox="0 0 16 16" stroke="#fff" stroke-width="1.3" stroke-linecap="round"><path d="M8 4.6v6.8M4.6 8h6.8"/></svg></button>
    <button class="cbtn sm arrow prev" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 4.4 6 8l3.6 3.6"/></svg></button>
    <button class="cbtn sm arrow next" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 4.4 10 8l-3.6 3.6"/></svg></button>
  </section>

  <!-- ============ RIGHT: CONTAINER CARDS ============ -->
  <section class="panel panel-right top">
    <div class="panel-title dims">12,192 x 2,438 x 2,591 mm</div>
    <button class="cbtn sm panel-gear" aria-label="Container settings"><svg class="cog" viewBox="0 0 16 16"><use href="#cog"/></svg></button>
    <div class="id-label" style="top:76px">Flatcar ID:</div>
    <div class="id-value" style="top:98px">40CN</div>
    <div class="ctr" style="left:111px;top:171px">
      <canvas id="tray40" aria-hidden="true"></canvas>
      <svg class="move" viewBox="0 0 20 20"><use href="#move"/></svg>
    </div>
    <div class="sel-label" style="left:25px;top:287px">Depart By:</div>
    <div class="sel-label" style="left:248px;top:287px">Dest. Rail Block:</div>
    <div class="select" style="left:10px"><i style="background:#6f8d00"></i>L 184 12<svg viewBox="0 0 10 10"><use href="#chev"/></svg></div>
    <div class="select" style="left:234px"><i style="background:#1677e6"></i>BNPH<svg viewBox="0 0 10 10"><use href="#chev"/></svg></div>
  </section>

  <section class="panel panel-right bottom">
    <div class="panel-title dims">16,154 x 2,591 x 2,896 mm</div>
    <button class="cbtn sm panel-gear" aria-label="Container settings"><svg class="cog" viewBox="0 0 16 16"><use href="#cog"/></svg></button>
    <div class="id-label" style="top:76px">Flatcar ID:</div>
    <div class="id-value" style="top:98px">53CN</div>
    <div class="ctr" style="left:91px;top:167px">
      <canvas id="tray53" aria-hidden="true"></canvas>
      <svg class="move" viewBox="0 0 20 20"><use href="#move"/></svg>
    </div>
    <div class="sel-label" style="left:25px;top:287px">Depart By:</div>
    <div class="sel-label" style="left:249px;top:287px">Dest. Rail Block:</div>
    <div class="select" style="left:10px"><i style="background:#f5752e"></i>Q 143 12<svg viewBox="0 0 10 10"><use href="#chev"/></svg></div>
    <div class="select" style="left:235px"><i style="background:#8c8c8c"></i>NSAI<svg viewBox="0 0 10 10"><use href="#chev"/></svg></div>
  </section>

  <!-- ============ BOTTOM CONTROLS ============ -->
  <div class="zoom">
    <button class="cbtn sm" aria-label="Zoom out"><svg viewBox="0 0 16 16" stroke="#000" stroke-width="1.1" stroke-linecap="round"><path d="M4.4 8h7.2"/></svg></button>
    <div class="track"><span class="knob"></span></div>
    <button class="cbtn sm" aria-label="Zoom in"><svg viewBox="0 0 16 16" stroke="#000" stroke-width="1.1" stroke-linecap="round"><path d="M8 4.4v7.2M4.4 8h7.2"/></svg></button>
  </div>
  <div class="tools">
    <button class="cbtn sm" aria-label="Search"><svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"><circle cx="7.4" cy="7.2" r="5.3"/><path d="m11.3 11.1 2.5 2.5"/></svg></button>
    <button class="cbtn sm" aria-label="Layout"><svg viewBox="0 0 16 16"><rect x="1.8" y="1.8" width="5.6" height="7" rx="1.6"/><rect x="8.6" y="1.8" width="5.6" height="5" rx="1.6"/><rect x="1.8" y="10" width="5.6" height="4.2" rx="1.6"/><rect x="8.6" y="8" width="5.6" height="6.2" rx="1.6"/></svg></button>
    <button class="cbtn sm" aria-label="Settings"><svg class="cog" viewBox="0 0 16 16"><use href="#cog"/></svg></button>
  </div>

  <!-- ============ FLATCAR STRIP ============ -->
  <div class="strip" id="strip"></div>

  <!-- shared icon symbols -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="cog" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M6.9 1.2h2.2l.4 1.9c.5.2.9.4 1.3.7l1.8-.6 1.1 1.9-1.4 1.3c.1.5.1 1 0 1.5l1.4 1.3-1.1 1.9-1.8-.6c-.4.3-.8.5-1.3.7l-.4 1.9H6.9l-.4-1.9c-.5-.2-.9-.4-1.3-.7l-1.8.6-1.1-1.9 1.4-1.3c-.1-.5-.1-1 0-1.5L2.3 5.1l1.1-1.9 1.8.6c.4-.3.8-.5 1.3-.7zM8 5.6a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6z" transform="translate(0 .1)"/></symbol>
      <symbol id="chev" viewBox="0 0 10 10"><path d="M2.4 3.8 5 6.3l2.6-2.5" fill="none" stroke="#111" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="move" viewBox="0 0 20 20"><g fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2v4M8.2 5l1.8-1.8L11.8 5M10 16.8v-4M8.2 15l1.8 1.8 1.8-1.8M3.2 10h4M5 8.2 3.2 10 5 11.8M16.8 10h-4M15 8.2l1.8 1.8-1.8 1.8"/></g></symbol>
    </defs>
  </svg>
</main>
</div>
<script src="art.js"></script>
<script src="art-stock.js"></script>
<script src="motion.js"></script>
<script src="sim.js"></script>
<script src="meter.js"></script>
<script src="train.js"></script>
<script src="app.js"></script>
</body>
</html>
